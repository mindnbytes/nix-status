id = "local/nix-status"
name = "Nix Status"
version = "0.2.0"
plugin_api = 30
author = "mindnbytes"
dependencies = ["nix"]

[[setting]]
key = "flake_dir"
type = "folder"
label_key = "settings.flake_dir.label"
description_key = "settings.flake_dir.description"
default = ""

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "status"
entry = "widget.luau"

[[panel]]
id = "details"
entry = "panel.luau"
placement = "attached"
open_near_click = true
